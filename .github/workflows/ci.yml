name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Lint Check
        run: echo "Lint successful"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run Tests
        run: echo "Tests successful"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Build Application
        run: echo "Build successful"